server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin proxy to the API, which has no CORS middleware.
    # Docker's DNS + a variable makes nginx re-resolve agent-api if the container is recreated.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://agent-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;

        proxy_set_header Host $host;
        # The API rate-limits per client IP; without this every user shares nginx's address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent may try the primary and then the fallback model, 30s timeout each
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
