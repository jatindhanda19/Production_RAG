services:
  agent-api:
    build: .
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      # Trust X-Forwarded-For only from the frontend proxy, so rate limiting sees real client IPs
      - FORWARDED_ALLOW_IPS=172.28.0.10

    networks:
      - app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:8080"

    depends_on:
      agent-api:
        condition: service_healthy

    networks:
      app:
        ipv4_address: 172.28.0.10

    restart: unless-stopped

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24

