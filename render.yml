services:
  - type: web
    name: production-langgraph-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Serves the chat UI at / and the API under /api from one process
    startCommand: uv run uvicorn frontend.asgi:site --host 0.0.0.0 --port $PORT
    envVars:
     - key : PYTHON_VERSION
       value: "3.12.3"
     - key: APP_ENV
       value: production
     - key: LOG_LEVEL
       value: INFO
     - key: RATE_LIMIT
       value: "20/minute"
     - key: CACHE_TTL_SECONDS
       value: "300"
     - key: PRIMARY_MODEL
       value: openai/gpt-oss-120b
     - key: FALLBACK_MODEL
       value: openai/gpt-oss-20b
     - key: GROQ_API_KEY
       sync: false
     - key: LANGSMITH_API_KEY
       sync: false
     - key: LANGSMITH_TRACING
       value: "true"
     - key: LANGSMITH_PROJECT
       value: production-api
    healthCheckPath: /api/health
    autoDeploy: true


