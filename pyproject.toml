[project]
name = "production-rag-api"
version = "0.1.0"
description = "Production-ready chat API with security, caching, and observability"
readme = "README.md"
authors = [
    { name = "Jatin Dhanda", email = "dhandajatin70@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langsmith>=0.13.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
